<!DOCTYPE html>
<html>
<head>
  <title>Claude Token Logo Preview</title>
  <style>
    body {
      background-color: #111418; /* Dark preview background to see the token clearly */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .logo-container {
      width: 400px;
      height: 400px;
    }
  </style>
</head>
<body>

  <div class="logo-container">
    <svg xmlns="http://w3.org" viewBox="0 0 500 500" width="100%" height="100%">
      <!-- Transparent Background -->
      <rect width="100%" height="100%" fill="none"/>
      
      <g transform="translate(250, 250)">
        <!-- Outer Token Ring (Crypto/Blockchain Border) -->
        <circle r="220" fill="none" stroke="#D97706" stroke-width="12" stroke-dasharray="16 12" />
        <circle r="195" fill="none" stroke="#CC5A37" stroke-width="6" opacity="0.7"/>

        <!-- Claude-Inspired Aperture Shapes (Background Layer) -->
        <g fill="#CC5A37" opacity="0.15">
          <path d="M -80,-80 C -40,-120 40,-120 80,-80 C 120,-40 120,40 80,80 C 40,120 -40,120 -80,80 C -120,40 -120,-40 -80,-80 Z" />
          <path d="M -100,0 C -100,-60 -60,-100 0,-100 C 60,-100 100,-60 100,0 C 100,60 60,100 0,100 C -60,100 -100,60 -100,0 Z" transform="rotate(45)" />
        </g>

        <!-- Core Token Body -->
        <circle r="140" fill="#1F1F1F" stroke="#CC5A37" stroke-width="8" />
        <circle r="120" fill="none" stroke="#D97706" stroke-width="3" stroke-dasharray="6 6" />

        <!-- Central Dollar Sign Mesh -->
        <g fill="#CC5A37">
          <!-- Vertical Bar -->
          <rect x="-10" y="-90" width="20" height="180" rx="6" />
          <!-- Dollar curves -->
          <path d="M -50,-40 C -50,-80 50,-80 50,-40 C 50,-10 -50,-10 -50,20 C -50,60 50,60 50,20" fill="none" stroke="#CC5A37" stroke-width="24" stroke-linecap="round" />
        </g>
        
        <!-- Accent Core Glow -->
        <circle r="15" fill="#D97706" opacity="0.8" />
      </g>
    </svg>
  </div>

</body>
</html>
