<!DOCTYPE html>
<html>
<head>
  <title>Claude Code Tracker Icon Preview</title>
  <style>
    body {
      background-color: #0E1116; /* Dark wallpaper background */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .icon-wrapper {
      width: 320px;
      height: 320px;
      filter: drop-shadow(0px 20px 25px rgba(0, 0, 0, 0.65)) drop-shadow(0px 4px 10px rgba(0, 0, 0, 0.4));
    }
    .label {
      color: #8A99AD;
      margin-top: 24px;
      font-size: 14px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="icon-wrapper">
    <svg xmlns="http://w3.org" viewBox="0 0 512 512" width="100%" height="100%">
      <defs>
        <!-- App Squircle Mask -->
        <clipPath id="squircle">
          <path d="M 512,128 C 512,24 488,0 384,0 L 128,0 C 24,0 0,24 0,128 L 0,384 C 0,488 24,512 128,512 L 384,512 C 488,512 512,488 512,384 Z"/>
        </clipPath>

        <!-- Premium Monolithic Background -->
        <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1E222B"/>
          <stop offset="100%" stop-color="#11141A"/>
        </linearGradient>
        
        <!-- App Bezel Highlight -->
        <linearGradient id="borderGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
        </linearGradient>

        <!-- Chart Bar Gradients (Data/Tokens Tracking) -->
        <linearGradient id="bar1" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#CC5A37" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="#CC5A37"/>
        </linearGradient>
        <linearGradient id="bar2" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#D97706" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="#D97706"/>
        </linearGradient>
        <linearGradient id="bar3" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#EAB308" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="#EAB308"/>
        </linearGradient>

        <!-- Real-Time/AI Glow Filters -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="8" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="25" result="blur" />
        </filter>
      </defs>

      <!-- Main macOS Squircle Tile -->
      <g clip-path="url(#squircle)">
        <rect width="512" height="512" fill="url(#bgGrad)"/>
        
        <!-- Background Grid Matrix -->
        <g stroke="#ffffff" stroke-width="1" opacity="0.04">
          <path d="M 0,64 L 512,64 M 0,128 L 512,128 M 0,192 L 512,192 M 0,256 L 512,256 M 0,320 L 512,320 M 0,384 L 512,384 M 0,448 L 512,448" />
          <path d="M 64,0 L 64,512 M 128,0 L 128,512 M 192,0 L 192,512 M 256,0 L 256,512 M 320,0 L 320,512 M 384,0 L 384,512 M 448,0 L 448,512" />
        </g>

        <!-- Ambient Backdrop Color Glow behind chart bars -->
        <circle cx="256" cy="260" r="120" fill="#CC5A37" opacity="0.12" filter="url(#softGlow)"/>

        <!-- REAL-TIME TRACKING TIME SERIES CHART -->
        <g transform="translate(80, 80)">
          <!-- Trendline / Analytics connection paths -->
          <path d="M 40,240 L 110,170 L 180,210 L 250,90 L 320,120" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.2" stroke-linecap="round" stroke-linejoin="round"/>
          
          <!-- Bar 1: Historical Baseline -->
          <rect x="25" y="150" width="30" height="110" rx="6" fill="url(#bar1)"/>
          <!-- Bar 2: Mid-range usage -->
          <rect x="95" y="110" width="30" height="150" rx="6" fill="url(#bar1)"/>
          <!-- Bar 3: Spiking usage -->
          <rect x="165" y="160" width="30" height="100" rx="6" fill="url(#bar2)"/>
          <!-- Bar 4: Current Real-time Token burst -->
          <rect x="235" y="50" width="30" height="210" rx="6" fill="url(#bar3)" filter="url(#glow)"/>

          <!-- X-Axis Base Line -->
          <line x1="0" y1="260" x2="352" y2="260" stroke="#ffffff" stroke-width="2" opacity="0.15" stroke-linecap="round"/>
        </g>

        <!-- CLAUDE BRAND DESIGN SIGNIFIER -->
        <!-- Integrating Claude's 8-pointed geometric spark directly into the real-time milestone marker -->
        <g transform="translate(315, 130)" filter="url(#glow)">
          <line x1="0" y1="0" x2="-40" y2="-40" stroke="#EAB308" stroke-width="3" opacity="0.5"/>
          <line x1="0" y1="0" x2="40" y2="-30" stroke="#EAB308" stroke-width="3" opacity="0.5"/>
          
          <circle cx="-40" cy="-40" r="6" fill="#D97706"/>
          <circle cx="40" cy="-30" r="8" fill="#EAB308"/>
          
          <!-- The Claude Aperture Spark Geometry -->
          <path d="M 0,-18 C 8,-18 14,-10 8,0 C 14,10 8,18 0,18 C -8,18 -14,10 -8,0 C -14,-10 -8,-18 0,-18 Z" fill="#EAB308" />
          <path d="M 0,-18 C 8,-18 14,-10 8,0 C 14,10 8,18 0,18 C -8,18 -14,10 -8,0 C -14,-10 -8,-18 0,-18 Z" fill="#EAB308" transform="rotate(45)" opacity="0.85"/>
          <circle cx="0" cy="0" r="4" fill="#ffffff"/>
        </g>

        <!-- LARGE HIGH-CONTRAST DOLLAR METRIC (Scaled Up and Moved into Clear Space) -->
        <g transform="translate(425, 395)">
          <text x="0" y="0" font-family="-apple-system, SF Pro Display, sans-serif" font-size="52" font-weight="700" fill="#EAB308" text-anchor="middle" filter="url(#glow)">$</text>
        </g>

        <!-- SPECIFIC TEXT BRANDING: CLAUDE CODE TERMINAL INSIGNIA -->
        <g transform="translate(64, 420)">
          <!-- Monospace/Developer Terminal Style Tag -->
          <text x="0" y="0" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="22" font-weight="700" fill="#ffffff" opacity="0.85" letter-spacing="1">CLAUDE_CODE</text>
          <!-- Live Telemetry blinking line indicator -->
          <rect x="182" y="-18" width="10" height="22" fill="#CC5A37" filter="url(#glow)"/>
        </g>

        <!-- App Interior Edge Highlight (macOS native bezel effect) -->
        <path d="M 512,128 C 512,24 488,0 384,0 L 128,0 C 24,0 0,24 0,128 L 0,384 C 0,488 24,512 128,512 L 384,512 C 488,512 512,488 512,384 Z" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>
      </g>
    </svg>
  </div>

  <div class="label">Refined Claude Code Tracker App Icon</div>

</body>
</html>
